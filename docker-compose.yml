# Local bazel-remote for trying the cache without GCP:
#   docker compose up -d
# then temporarily set `host: 'http://127.0.0.1.nip.io:8080'` in
# .moon/workspace.yml and export MOON_REMOTE_TOKEN=anything.
# (moon refuses `localhost` hosts when it thinks it runs in CI, and nip.io
# resolves to 127.0.0.1 without matching that check.)
services:
  bazel-remote:
    image: buchgr/bazel-remote-cache:v2.6.2
    command: ['--dir=/data', '--max_size=1', '--http_address=0.0.0.0:8080']
    ports:
      - '8080:8080'
    volumes:
      - bazel-remote-data:/data

volumes:
  bazel-remote-data:
